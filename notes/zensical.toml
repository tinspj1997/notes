[project]

site_name = "My Learning Notes"

site_description = "A new project generated from the default template project."

site_author = "<your name here>"

#site_url = "https://www.example.com/"

copyright = """
Copyright &copy; 2026 Tins P Joseph. All rights reserved.
"""

nav = [
   { "Get started" = "index.md" },
   { "Agents" = "agents/index.md" },
   {"Database" = "database/index.md"  },
   {"Server" = "server/index.md"  },
   {"Logging" = "logging/index.md"},
    {"Prompt" = "prompt/index.md"},
    {"Learning" = "learning/index.md"},
]

#extra_css = ["stylesheets/extra.css"]

#extra_javascript = ["javascripts/extra.js"]

[project.theme]

#variant = "classic"

#custom_dir = "overrides"

favicon = "assets/images/logo.png"

logo = "assets/images/logo.png"

language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

[project.theme.icon]
logo = "assets/images/logo.png"

#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/user/repo"


